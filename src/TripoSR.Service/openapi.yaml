openapi: 3.0.3
info:
  title: TripoSR service (.NET)
  version: "1"
  description: >-
    Makes a 3D model (a binary glTF) from one picture with TripoSR. It is the same interface as the Python container `docker/model3d` of
    mediaOrquestator (`GET /health`, `GET /engines`, `POST /generate`, `GET /jobs/{id}`, `GET /jobs/{id}/model`, `DELETE /jobs/{id}`), so the
    orchestrator uses it as a service of its own with no change in the way it asks. One model is made at a time; the others wait in arrival order.
    Plain HTTP, for localhost or a trusted network; set a token (`TRIPOSR_TOKEN`) and put a reverse proxy in front of it to reach it from elsewhere.
servers:
  - url: http://localhost:8790
security:
  - bearer: []
paths:
  /health:
    get:
      summary: Whether the service can make a model now, and what it is doing
      responses:
        "200":
          description: The state. `ready` is false while a file of the weights is missing (named in `missing`) or the device does not work.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /engines:
    get:
      summary: The engines this service has and whether each can be used
      responses:
        "200":
          description: One engine, `triposr`.
          content:
            application/json:
              schema:
                type: object
                required: [engines]
                properties:
                  engines:
                    type: object
                    additionalProperties: { $ref: "#/components/schemas/Engine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /generate:
    post:
      summary: Queue the model of a picture
      description: >-
        The body is the picture (png, jpg or webp, up to 20 MB). `engine` must be `triposr`. `detail` is the resolution of the marching-cubes grid (it decides the triangles).
      parameters:
        - { name: engine, in: query, schema: { type: string, default: "triposr" } }
        - { name: detail, in: query, schema: { type: string, enum: [low, normal, high], default: normal } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { type: object, required: [id], properties: { id: { type: string } } }
        "400": { description: "The request cannot be made: another engine, a detail that is none, a body that is not a picture, or weights that are not complete.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: The picture is larger than 20 MB., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /jobs/{id}:
    get:
      summary: One job
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The job. `state` is queued, running, done or failed (then `error` says why).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No such job., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      summary: Forget a job and its model
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Forgotten., content: { application/json: { schema: { type: object, required: [deleted], properties: { deleted: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No such job., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /jobs/{id}/model:
    get:
      summary: The model of a finished job
      description: A binary glTF standing upright (Y up), its origin at the middle of its base, with its colours and no more triangles than a scene of the orchestrator takes (500,000).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: The .glb., content: { model/gltf-binary: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No such job., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: The model is not ready (the state is in the message)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  responses:
    Unauthorized:
      description: A token is needed (or it is wrong).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Gpu:
      type: object
      required: [name]
      properties:
        name: { type: string }
        free_mb: { type: integer, format: int64, nullable: true }
        total_mb: { type: integer, format: int64, nullable: true }
    Engine:
      type: object
      required: [built, missing, ready, version]
      properties:
        built: { type: boolean }
        missing: { type: array, items: { type: string } }
        ready: { type: boolean }
        version: { type: string, description: "What a model of this engine says made it (`triposr-net@<version of the port>`): part of what decides a model." }
    Health:
      type: object
      required: [ready, version, busy, queued, gpu, missing, engines]
      properties:
        ready: { type: boolean }
        version: { type: string }
        busy: { type: boolean }
        queued: { type: integer }
        gpu: { allOf: [{ $ref: "#/components/schemas/Gpu" }], nullable: true }
        missing: { type: array, items: { type: string } }
        engines:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Engine" }
    Job:
      type: object
      required: [id, state, progress, error, seconds, engine, engine_version, detail, detail_used, resolution, triangles]
      properties:
        id: { type: string }
        state: { type: string, enum: [queued, running, done, failed] }
        progress:
          type: object
          required: [done, total]
          properties: { done: { type: integer }, total: { type: integer } }
        error: { type: string }
        seconds: { type: number }
        engine: { type: string }
        engine_version: { type: string }
        detail: { type: string }
        detail_used: { type: string, description: The detail it was made at (lower than asked when the first had too many triangles). }
        resolution: { type: integer, description: "the resolution of the marching-cubes grid (it decides the triangles)" }
        triangles: { type: integer }
